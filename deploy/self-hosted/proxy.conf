client_max_body_size 32m;
resolver 127.0.0.11 valid=10s;
set $maple_backend http://maple:3472;
set $maple_ingest http://ingest:3474;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 300s;
proxy_buffering off;

location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass $maple_backend$request_uri;
}
location /api/ { proxy_pass $maple_backend$request_uri; }
location /internal/ { proxy_pass $maple_backend$request_uri; }
location = /mcp { proxy_pass $maple_backend$request_uri; }
location /mcp/ { proxy_pass $maple_backend$request_uri; }
location = /register { proxy_pass $maple_backend$request_uri; }
location /.well-known/ { proxy_pass $maple_backend$request_uri; }
location /oauth/ { proxy_pass $maple_backend$request_uri; }
location /v2/ { proxy_pass $maple_backend$request_uri; }
location = /openapi.json { proxy_pass $maple_backend$request_uri; }
location = /health { proxy_pass $maple_backend$request_uri; }
location /hb/ {
    access_log off;
    proxy_pass $maple_backend$request_uri;
}
location /ingest/ {
    rewrite ^/ingest/(.*)$ /$1 break;
    proxy_pass $maple_ingest$uri$is_args$args;
}
# Trusted service endpoints never leave the Compose network.
location /v0/ { return 404; }
