name: Self-hosted images

# Builds the images deploy/self-hosted/compose.yaml runs and pushes them to GHCR, so a Dokploy deploy pulls instead of
# compiling the Rust ingest gateway on the host.

on:
  push:
    branches: [self-hosted]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            file: deploy/self-hosted/Dockerfile
            target: server
          - name: web
            context: .
            file: deploy/self-hosted/Dockerfile
            target: web
          - name: ingest
            context: apps/ingest
            file: apps/ingest/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/freeaoi/maple-${{ matrix.name }}:latest
            ghcr.io/freeaoi/maple-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
